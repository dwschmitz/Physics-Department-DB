{% macro delete_button(action, prompt) %}
<form class="inline" method="post" action="{{ action }}" onsubmit="return confirm({{ prompt|tojson }})">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn danger small">Delete</button>
</form>
{% endmacro %}

{# Clickable, sortable column header. Import with context. #}
{% macro sort_th(label, key, sort, sdir, title=None, cls=None) %}
<th{% if cls %} class="{{ cls }}"{% endif %}{% if title %} title="{{ title }}"{% endif %} aria-sort="{{ ('ascending' if sdir == 'asc' else 'descending') if sort == key else 'none' }}">
  <a class="sortlink{{ ' active' if sort == key }}" href="{{ sort_url(key, sort, sdir) }}">{{ label }}
    <span aria-hidden="true">{{ ('▲' if sdir == 'asc' else '▼') if sort == key else '↕' }}</span></a>
</th>
{% endmacro %}
