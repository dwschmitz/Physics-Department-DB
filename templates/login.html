{% extends "base.html" %}{% block body %}
<h1>Log in</h1>
<form method="post" class="form">
  <div class="field"><label for="username">Username</label><input id="username" name="username" autofocus required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
  <button class="btn">Log in</button>
</form>{% endblock %}
